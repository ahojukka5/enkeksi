name: Refresh sqlfence lockfile once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rename-package-sqlfence
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
      - name: Regenerate and commit lockfile
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "Refresh sqlfence lockfile"
          git push origin HEAD:agent/rename-package-sqlfence
      - name: Remove one-shot workflow from master
        if: always()
        run: |
          git fetch origin master
          git worktree add /tmp/sqlfence-master origin/master
          cd /tmp/sqlfence-master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-sqlfence-lock-once.yml
          git commit -m "Remove one-shot lockfile workflow"
          git push origin HEAD:master
