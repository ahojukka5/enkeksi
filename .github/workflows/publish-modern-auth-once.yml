name: Publish enkeksi 1.0 with modern auth

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/enkeksi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
      - name: Clean previous release result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .publish-result.txt .publish-modern-result.txt
          git rm .github/workflows/publish-modern-auth-once.yml
          git add -A
          git commit -m "Clean one-shot publication files"
          git push origin HEAD:master
      - run: uv build
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Publish and record result
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          token="${PYPI_API_TOKEN:-$PYPI_TOKEN}"
          set +e
          if [[ -n "$token" ]]; then
            auth_mode=token
            UV_PUBLISH_TOKEN="$token" uv publish > /tmp/publish.log 2>&1
          else
            auth_mode=trusted-publisher
            uv publish > /tmp/publish.log 2>&1
          fi
          rc=$?
          set -e
          cat /tmp/publish.log
          {
            echo "auth_mode=$auth_mode"
            echo "exit_code=$rc"
            cat /tmp/publish.log
          } > .publish-modern-result.txt
          git add .publish-modern-result.txt
          git commit -m "Record modern PyPI publication result"
          git push origin HEAD:master
          exit "$rc"
