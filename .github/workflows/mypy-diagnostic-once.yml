name: Mypy diagnostic once

on:
  push:
    branches: [agent/enkeksi-1.0]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/enkeksi-1.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run mypy > .mypy-errors.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mypy-errors.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record mypy diagnostic"
          git push origin HEAD:agent/enkeksi-1.0
