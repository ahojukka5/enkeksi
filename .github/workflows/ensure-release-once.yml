name: Ensure GitHub release once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Ensure v1.0.0 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 \
              --title "enkeksi 1.0.0" \
              --notes "First stable release of the modernized enkeksi Markdown-SQL evaluator. See CHANGELOG.md for the complete feature and migration summary."
      - name: Clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .publish-modern-result.txt .publish-result.txt
          git rm .github/workflows/ensure-release-once.yml
          git add -A
          git commit -m "Clean release verification files"
          git push origin HEAD:master
