name: Release diagnostic now

on:
  push:
    branches: [master]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Record release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          row=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq '[.workflow_runs[] | select(.name == "Publish release to PyPI")][0] | [.id, .status, (.conclusion // "")] | @tsv')
          IFS=$'\t' read -r run_id status conclusion <<< "$row"
          {
            echo "run_id=$run_id"
            echo "status=$status"
            echo "conclusion=$conclusion"
          } > .release-diagnostic.txt
          if [[ -n "$run_id" && "$status" == "completed" && "$conclusion" != "success" ]]; then
            gh run view "$run_id" --log-failed >> .release-diagnostic.txt 2>&1 || true
          fi
          python - <<'PY' >> .release-diagnostic.txt
          import json
          import urllib.request
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/enkeksi/json", timeout=20) as response:
                  data = json.load(response)
              print(f"pypi_version={data['info']['version']}")
              print(f"pypi_has_1.0.0={'1.0.0' in data['releases']}")
          except Exception as error:
              print(f"pypi_error={error}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/verify-release-once.yml
          rm -f .github/workflows/release-diagnostic-now.yml
          git add -A
          git commit -m "Record immediate release diagnostic"
          git push origin HEAD:master
