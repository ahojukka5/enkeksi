name: Type fix once

on:
  push:
    branches: [agent/enkeksi-1.0]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/enkeksi-1.0
      - name: Apply targeted type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/enkeksi/core.py')
          text = path.read_text()
          text = text.replace(
              'return sqlite3.connect(database, uri=True)',
              'return cast(Connection, sqlite3.connect(database, uri=True))',
          )
          text = text.replace(
              'return sqlite3.connect(options.database)',
              'return cast(Connection, sqlite3.connect(options.database))',
          )
          path.write_text(text)
          PY
          rm -f .mypy-errors.txt
          rm -f .github/workflows/mypy-diagnostic-once.yml
          rm -f .github/workflows/type-fix-once.yml
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix database connection typing"
          git push origin HEAD:agent/enkeksi-1.0
