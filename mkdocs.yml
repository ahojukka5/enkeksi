site_name: sqlfence
site_description: Execute SQL examples embedded in Markdown.
site_url: https://sqlfence.readthedocs.io/
repo_url: https://github.com/ahojukka5/sqlfence
repo_name: ahojukka5/sqlfence
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - SQL blocks: syntax.md
  - Command line: cli.md
  - Python API: api.md
  - Migration from enkeksi: migration.md
  - Releasing: releasing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
